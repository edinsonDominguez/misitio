

<!-- Modal -->
<div class="modal fade" id="carro" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
           ...................
           {% if request.session.compra.items %}

  <h6>Carrito</h6>
  
  <table>
      <tr>
          <th>nombre</th>
          <th>cantidad</th>
          <th>valor</th>
          <th>opciones</th>
      </tr>
      {% for key, value in request.session.compra.items %}
      <tr>
          
              <td>{{ value.nombre }}</td>
              <td>{{ value.cantidad }}</td>
              <td>{{ value.valor }}</td>
              <td>
                  <a href="{% url 'compra:agregar' value.producto_id %}">agregar</a>
                  <a href="{% url 'compra:restar' value.producto_id %}">restar</a>
              </td>
              
          
      </tr>
      {% endfor %}
  </table>
  
  {% endif %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>
